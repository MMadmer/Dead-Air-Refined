# Every six hours (MOD_CATALOG 10.2, 11, 12.3): the latest release of every listed module into
# cards.txt, VirusTotal into vt.txt (secret VT_API_KEY), the review inbox into ratings and
# reviews. An issue is opened for a listed module whose release fails the checks.
name: watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog-public
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cards and thumbnails
        run: python3 tools/catalog.py cards --issues issues.md
      # VirusTotal and the review inbox are outside services: a failure of either leaves its own
      # files as they were and never keeps the cards from being committed
      - name: VirusTotal
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: python3 tools/catalog.py vt
      - name: Reviews
        continue-on-error: true
        run: python3 tools/catalog.py reviews
      - name: Commit what changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add public
          if ! git diff --cached --quiet; then
            git commit -m "Refresh cards, VirusTotal results and reviews"
            git push
          fi
      - name: Report failing modules
        if: hashFiles('issues.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Listed modules failing the checks" --body-file issues.md
