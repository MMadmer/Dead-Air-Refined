# Every pull request (MOD_CATALOG 10.2): only mods/<id>.ltx may change, and the submission passes
# section 7, the content policy and the script report. No secrets: the job cannot sign anything.
name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Only one submission file changes
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          python tools/catalog.py only-submissions changed.txt
      - name: Check the submission
        run: >
          python tools/catalog.py check --changed changed.txt
          --author "${{ github.event.pull_request.user.login }}"
          --summary "$GITHUB_STEP_SUMMARY"
