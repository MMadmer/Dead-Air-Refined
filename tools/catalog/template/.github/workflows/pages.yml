# public/ on GitHub Pages: after a push to main, and after watch or publish commit (a push made
# with the workflow token starts no workflow by itself).
name: pages

on:
  push:
    branches: [main]
    paths: ['public/**']
  workflow_run:
    workflows: [watch, publish]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
