# public/ on GitHub Pages after a maintainer's own push to it. publish.yml deploys what it
# publishes itself: a push made with the workflow token starts no workflow.
name: pages

on:
  push:
    branches: [main]
    paths: ['public/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
      # jsDelivr keeps a branch's files for up to twelve hours: the mirror follows the site now.
      # Thumbnails are named by their hash and never change, so they are left alone.
      - name: Refresh the jsDelivr mirror
        continue-on-error: true
        run: |
          cd public
          find . -type f ! -name '.*' ! -path './thumbs/*' | sed 's|^\./||' | while read -r file; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/public/$file" > /dev/null || true
          done
