id: io.github.MMadmer.Dead-Air-Refined
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: xr_3da
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: XFined-Ray
    buildsystem: cmake
    sources:
      - type: git
        url: https://github.com/MMadmer/Dead-Air-Refined.git
        branch: dev
    config-opts:
      - -D CMAKE_BUILD_TYPE=ReleaseMasterGold
      - -D CMAKE_UNITY_BUILD=ON

#rename-icon: xfined-ray_cop.png
rename-desktop-file: xfined-ray_cop.desktop
