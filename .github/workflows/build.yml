name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Mixed
          - Release
          - ReleaseMasterGold

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build runtime
        shell: pwsh
        run: tools/build/build_x64.ps1 -Configuration ${{ matrix.configuration }} -Clean

      - name: Upload runtime
        uses: actions/upload-artifact@v7
        with:
          name: dead-air-x64-${{ matrix.configuration }}
          path: bin/x64/${{ matrix.configuration }}
          if-no-files-found: error
